name = "blazie"
created = "2026-08-12"
engine = "git+https://github.com/socialite-ml/montology@main#subdirectory=.monty/cli"

[guard]
# the firewall (agent pre-write hook): block | warn | off
names  = "block"   # retired words ALWAYS block; collisions follow [scan]
design = "block"   # rogue values vs tokens — only fires when tokens exist

[scan]
# which word kinds a code declaration may NOT be named after
enforced_kinds = ["core", "inner"]

# ── how a collision is judged here ─────────────────────────────────────────────
#
# Not every symbol sharing a word's name is drift, and treating them alike
# produces a list nobody reads. Four cases, and only two of them are defects:
#
#   A basic verb below the surface is fine. `Store.open`, `Keyring.open` and
#   `Ledger.open` all do ordinary work at a layer nobody authors against, and
#   English has one word for it. Renaming them buys nothing and costs clarity.
#
#   A primary verb — one of the four operations, at the surface — should be
#   literal, and is: `Controller.open` IS `open`, and means it.
#
#   A NOUN colliding is the real defect, because a noun names a thing and two
#   things with one name is the failure the vocabulary exists to prevent.
#
#   A VALUE TYPE should be consistent on purpose. The same value wears the same
#   name everywhere it appears — that is not a collision, it is the point. The
#   test is whether the two are interchangeable: if you could pass one where the
#   other is expected, one name is right; if you could not, two things are
#   wearing one noun and that is a defect wherever it appears.
#
# ── symbols allowed to share a word's name (each entry is a recorded decision) ─
#
# job — `Backup.job/1` and `Vitals.job/0` each return a `%Job{}`. They do not
# take the word to mean something else; they denote exactly the thing the word
# denotes, which is the case this list exists for. A function that hands back a
# job and is called anything but `job` would be the drift, not the fix.
#
# open, write, watch, ask — basic verbs. At the surface they ARE the operation
# and mean it; below it (`Store.open`, `Keyring.Local.write`) they are ordinary
# English doing ordinary work. Neither is a second meaning of the word.
#
# name, value — value type and noun, both used for exactly what they denote:
# `Snapshot.name/1` returns the name, `Snapshot.value/3` returns a fact's
# value. Kept deliberately consistent rather than renamed for distinctness.
#
# world — `Lua.world/2` builds one and hands it back. Same case as `job`: the
# noun collides with the function that constructs the thing it names, which is
# one thing wearing one name rather than two. `Lua.World` the module is the
# word spelled as a module, which is what a module for a noun should be called.
allow = ["job", "open", "write", "watch", "ask", "name", "value", "world"]

[gen]
# The rendered words skill does not fit the Agent Skills disclosure budget of
# 24,000 characters, and the decision recorded here is that it should not be
# made to. Seventeen words, each carrying its definition, its one-line test and
# the reasoning that settled it — the reasoning is the part that stops a word
# drifting back to what it displaced, and it is the first thing that would go to
# save characters.
#
# So the budget is raised and the gap is said on every lint rather than being
# quietly absent. The number is not free: it is ~6k tokens of every agent's
# context, spent on knowing what the words mean before writing any of them.
body_cap = 28000
body_cap_why = "seventeen words, each carrying the reasoning that settled it — and the reasoning is what stops a word drifting back to whatever it displaced, so it is exactly the wrong thing to cut for characters"
