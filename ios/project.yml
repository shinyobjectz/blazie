name: Blazie
options:
  bundleIdPrefix: com.shinyobjectz
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
settings:
  base:
    DEVELOPMENT_TEAM: BJJZ79J5NL
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    BLAZIE_HOST: mac.blazie.dev
    BLAZIE_TOKEN: unset
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Blazie:
    type: application
    platform: iOS
    sources: [Blazie]
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shinyobjectz.blazie
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Blazie/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
